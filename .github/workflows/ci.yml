name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: societypass, POSTGRES_PASSWORD: societypass, POSTGRES_DB: societypass_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U societypass" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q
        env: {TEST_DATABASE_URL: "postgresql+asyncpg://societypass:societypass@localhost:5432/societypass_test"}

  mobile:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  admin-web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: admin-web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: admin-web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
